name: Release

on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would both compute the same next
# version and race to publish it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to find the last release.
          fetch-depth: 0
          # Its own git plugin pushes the release commit; the checkout token
          # would otherwise shadow the one it is configured with.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Publishing something that does not build or pass its tests is worse than
      # not publishing: npm versions cannot be replaced, only deprecated.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release

on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would both compute the same next
# version and race to publish it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # semantic-release's git plugin pushes the release commit; its github plugin
  # creates the GitHub Release that stands in for a CHANGELOG file.
  contents: write
  # Mints the short-lived OIDC token npm exchanges for publish rights. This is
  # the entirety of our npm authentication — there is deliberately no NPM_TOKEN
  # secret to leak, rotate, or forget to renew.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the whole history to find the last release.
          fetch-depth: 0
          # Its own git plugin pushes the release commit; the checkout token
          # would otherwise shadow the one it is configured with.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds. A restored cache is one more
          # input that can differ from the one the verification steps audited.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm
      # today, but that is a property of whichever 24.x setup-node happens to
      # resolve, not a guarantee. Pinning the floor turns a future silent auth
      # failure into a non-event.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # The Python client releases on the same version as the npm ones, from the
      # same commit. semantic-release builds its distributions during publish,
      # after it has stamped pyproject.toml.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install the Python build backend
        run: pip install build

      - run: npm ci

      # Publishing something that does not build or pass its tests is worse than
      # not publishing: npm versions cannot be replaced, only deprecated.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # No NPM_TOKEN. The npm CLI detects the OIDC environment and exchanges the
      # id-token above for a publish credential scoped to this repository and
      # this workflow file. Both packages must have a trusted publisher pointing
      # at `release.yml` configured on npmjs.com or the publish is rejected.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `dist/` exists only when semantic-release decided there was a release to
      # cut. Gating on the artifact rather than on a parsed version keeps a
      # no-release run from re-publishing the version already on PyPI, which
      # PyPI rejects outright.
      - name: Did a release happen?
        id: dists
        run: |
          if compgen -G "packages/sdk-python/dist/*.whl" > /dev/null; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # Off until the PyPI project has a trusted publisher pointing at this
      # workflow. Set the PYPI_PUBLISH_ENABLED repository variable to `true` to
      # turn it on. A variable rather than continue-on-error, so that once it IS
      # on, a failed publish fails the run instead of being swallowed.
      - name: Publish to PyPI
        if: >-
          steps.dists.outputs.built == 'true'
          && vars.PYPI_PUBLISH_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/sdk-python/dist
          # semantic-release tags on success, so a failure HERE leaves a tagged,
          # npm-published release that no later push will retry: the next run
          # finds no new commits. Recovery is re-running this workflow by hand,
          # and that only works if re-uploading what PyPI already has is a
          # no-op rather than a 400.
          skip-existing: true
